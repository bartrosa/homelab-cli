version: 2

project_name: homelab-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: lab
    main: ./cmd/lab
    binary: lab
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/bartrosa/homelab-cli/internal/buildinfo.Version={{.Version}}
      - -X github.com/bartrosa/homelab-cli/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/bartrosa/homelab-cli/internal/buildinfo.Date={{.Date}}

archives:
  - id: lab
    builds:
      - lab
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

nfpms:
  - id: lab
    builds:
      - lab
    maintainer: "Your Name <you@example.com>"
    description: "Homelab automation CLI from bare metal to GPU-served LLMs"
    license: Apache-2.0
    bindir: /usr/bin
    section: utils
    homepage: "https://github.com/bartrosa/homelab-cli"
    recommends:
      - mise
      - podman
      - distrobox
    formats:
      - deb
      - rpm

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
  mode: replace


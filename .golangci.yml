version: "2"

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
    - gosec

  settings:
    gosec:
      excludes:
        - G204

issues:
  max-same-issues: 50

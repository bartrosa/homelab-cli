version: "2"

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
    - gosec

  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprint
        - fmt.Fprintln
    gosec:
      excludes:
        - G204
        - G301
        - G304
        - G306
        - G302
        - G110
        - G122
        - G703

issues:
  max-same-issues: 50
